name: Deploy Backend to Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.DROPLET_HOST }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.DROPLET_SSH_KEY }}
        port: ${{ secrets.DROPLET_PORT }}
        script_stop: true
        command_timeout: 30m
        script: |
          set -euo pipefail

          APP_DIR="${{ secrets.APP_DIR }}"
          REPO_URL="https://github.com/SuperLearnerPe/SL_BackEnd.git"
          BRANCH="main"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if [ ! -d .git ]; then
            git clone "$REPO_URL" .
          fi

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          # Escribe el .env de producción desde GitHub Secret
          printf "%s" "${{ secrets.ENV_PROD }}" > .env
          chmod 600 .env

          # Despliegue con Docker Compose
          # Recomendado: servicio web en compose de producción
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build

          # Limpieza opcional de imágenes antiguas
          docker image prune -f