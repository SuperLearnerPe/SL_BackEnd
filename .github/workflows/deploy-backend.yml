name: Deploy Backend to Droplet

run-name: Deploy PROD @${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: APP_DIR,ENV_PROD
          script: |
            set -euo pipefail

            REPO_URL="https://github.com/SuperLearnerPe/SL_BackEnd.git"
            BRANCH="main"
            PROJECT_NAME="sl-backend"

            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            printf '%s' "$ENV_PROD" > .env
            chmod 600 .env

            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "docker-compose is not available on the server." >&2
              exit 1
            fi

            docker-compose \
              -p "$PROJECT_NAME" \
              -f "$APP_DIR/docker-compose.yml" \
              --env-file .env \
              up -d --build --remove-orphans

            docker image prune -f